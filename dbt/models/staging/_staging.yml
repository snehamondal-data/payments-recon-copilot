version: 2

models:
  - name: stg_processor_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: [charge, refund, fee, dispute]
  - name: stg_bank_settlement_lines
    columns:
      - name: line_id
        data_tests: [unique, not_null]
  - name: stg_ledger_journals
    columns:
      - name: journal_id
        data_tests: [unique, not_null]
  - name: stg_fx_rates
    data_tests:
      - unique_combination:
          arguments:
            columns: [rate_date, currency]
