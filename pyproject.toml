[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-recon-copilot"
version = "0.7.0"
description = "Synthetic payments reconciliation pipeline with an AI copilot (fictional customer, synthetic data)."
requires-python = ">=3.12"
dependencies = [
    "anthropic~=2.4",
    "confluent-kafka~=2.16",
    # 1.4 is DuckDB's LTS line. 2.0.0 prints spurious nanobind "leaked" warnings at interpreter exit.
    "duckdb>=1.4,<1.5",
    # dbt-duckdb 1.11 supports DuckDB 1.4. dbt-snowflake 1.12 matches dbt-core 1.12 (arm64 wheels throughout).
    "dbt-core~=1.12.6",
    "dbt-duckdb~=1.11.1",
    "dbt-snowflake~=1.12.4",
    "snowflake-connector-python~=4.8",
    # dbt's semantic layer (Slice 8). 0.15 resolves with the pins above without moving any of them.
    "dbt-metricflow[dbt-duckdb]==0.15.0",
    "pydantic~=2.14",
    "python-dotenv~=1.2",
]

[project.optional-dependencies]
dev = ["pytest~=9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the local Kafka broker from docker compose (make up)",
    "live: calls the real Anthropic API (costs money; needs ANTHROPIC_API_KEY in .env)",
    "snowflake: runs against the Snowflake trial account (uses credits; needs the SNOWFLAKE_* settings in .env)",
]
addopts = "-m 'not integration and not live and not snowflake'"
