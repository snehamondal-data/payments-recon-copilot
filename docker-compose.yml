# Local single-node Apache Kafka in KRaft mode (no ZooKeeper). Project-scale, not production.
# apache/kafka publishes native arm64 images, so this runs without emulation on Apple Silicon.
name: recon

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: recon-kafka
    ports:
      - "9092:9092"
    environment:
      # One node acts as both broker and KRaft controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # PLAINTEXT is for other containers, PLAINTEXT_HOST for Python on the Mac.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single broker can only hold one replica of anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init, never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # Source topics keep data forever (retention.ms=-1) so a replay from the beginning always sees everything.
    command:
      - |
        set -euo pipefail
        bin=/opt/kafka/bin/kafka-topics.sh
        for t in processor.events bank.settlements ledger.entries; do
          $$bin --bootstrap-server kafka:19092 --create --if-not-exists --topic $$t \
            --partitions 3 --replication-factor 1 --config retention.ms=-1
        done
        $$bin --bootstrap-server kafka:19092 --create --if-not-exists --topic dlq \
          --partitions 1 --replication-factor 1 --config retention.ms=-1
        $$bin --bootstrap-server kafka:19092 --list
    restart: "no"

volumes:
  kafka-data:
